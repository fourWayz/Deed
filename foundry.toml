[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
# london: the Mezo explorer's verifier only knows EVM versions up to london
evm_version = "london"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[rpc_endpoints]
mezo_testnet = "https://rpc.test.mezo.org"
