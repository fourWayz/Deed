# fly launch --no-deploy --copy-config -c indexer/fly.toml   (once), then fly secrets set DATABASE_URL=...
# fly deploy -c indexer/fly.toml --dockerfile indexer/Dockerfile .
app = "deed-indexer"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  MEZO_TESTNET_RPC = "https://rpc.test.mezo.org"

[http_service]
  internal_port = 8787
  force_https = true
  # the sync loop lives in the same process, so the machine must never stop
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    path = "/health"
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
